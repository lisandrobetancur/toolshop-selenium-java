# Proxy FastCGI hacia el PHP-FPM del contenedor laravel-api. Reemplaza a la imagen
# testsmith/practice-software-testing-web, que solo se publica para linux/arm64.
# nginx no tiene el código: toda petición se envía a /var/www/public/index.php dentro de la API.
server {
    listen 80;
    root /var/www/public;
    index index.php;
    server_tokens off;

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass laravel-api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
